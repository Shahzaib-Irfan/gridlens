[project]
name = "gridlens"
version = "0.1.0"
description = "Grounded LLM incident reports from smart-meter event streams"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shahzaib Irfan" }]
dependencies = ["pydantic>=2.6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gridlens = "gridlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gridlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
